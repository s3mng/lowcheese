name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/upload-keystore.jks"

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/upload-keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        if: github.event_name == 'pull_request'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME//\//-}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/lowcheese-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/lowcheese-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: lowcheese-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
